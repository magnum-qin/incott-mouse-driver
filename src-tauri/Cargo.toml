[package]
name = "incott-mouse-driver"
version = "1.0.2"
description = "Incott 鼠标驱动 —— 独立桌面配置工具（基于逆向的 HID 协议）"
authors = ["magnum-qin"]
license = "MIT"
edition = "2021"

# 详见 README：fork 自 HeHaoren/incott-mouse-app（Electron 版），此为 Tauri 轻量化改造

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hidapi = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
